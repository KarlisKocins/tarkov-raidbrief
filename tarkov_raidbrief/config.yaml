---
name: Tarkov Raid Brief
slug: tarkov_raidbrief
version: "1.3.0"
description: >-
  Per-map Escape from Tarkov raid brief: what to carry in, what to loot,
  and what to do, driven by your live TarkovTracker progress.
url: https://github.com/KarlisKocins/tarkov-raidbrief
arch:
  - aarch64
  - amd64

# Pre-built by GitHub Actions and pushed to GHCR, so Home Assistant pulls the
# image instead of compiling on the Green. {arch} is substituted by Supervisor,
# and the tag it pulls is always the `version` above - bump both together.
image: ghcr.io/karliskocins/{arch}-addon-tarkov-raidbrief

# The HA base images ship s6-overlay, which is already PID 1. Don't fight it.
init: false

# Ingress is the primary entry point (sidebar + companion app). The direct
# port is published as well so you can curl the API while debugging.
ingress: true
ingress_port: 8099
panel_icon: mdi:crosshairs-gps
panel_title: Raid Brief
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct API access for debugging (leave unset to use Ingress only)

# /data is provided automatically and holds the task cache + progress snapshot.
map:
  - addon_config:rw

options:
  tarkovtracker_token: ""
  game_mode: regular
  refresh_minutes: 60
  kappa_only: false
  # Optional. Leaving the key empty disables all AI features and keeps the
  # add-on talking to tarkov.dev and TarkovTracker only.
  gemini_api_key: ""
  gemini_model: gemini-2.5-flash
  # Maps to hide completely - event maps, or ones you have not unlocked.
  # Use the name as shown in the UI, e.g. "Icebreaker". Case-insensitive.
  excluded_maps: []
  trader_levels:
    prapor: 1
    therapist: 1
    fence: 1
    skier: 1
    peacekeeper: 1
    mechanic: 1
    ragman: 1
    jaeger: 1
    ref: 1
    lightkeeper: 1

schema:
  tarkovtracker_token: password
  game_mode: list(regular|pve)
  refresh_minutes: int(5,1440)
  kappa_only: bool
  gemini_api_key: password?
  gemini_model: list(gemini-2.5-flash|gemini-2.5-flash-lite|gemini-3.5-flash|gemini-3.5-flash-lite|gemini-3.6-flash)
  excluded_maps:
    - str?
  trader_levels:
    prapor: int(1,4)
    therapist: int(1,4)
    fence: int(1,4)
    skier: int(1,4)
    peacekeeper: int(1,4)
    mechanic: int(1,4)
    ragman: int(1,4)
    jaeger: int(1,4)
    ref: int(1,4)
    lightkeeper: int(1,4)
